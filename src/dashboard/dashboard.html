<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <div class="app-shell">

    <div class="page-shell">
        <div class="top-strip">
            <div class="page-header">
                <div class="page-header-copy">
                    <p class="eyebrow">Job Tracker</p>
                    <div class="page-title-row">
                        <h1>Dashboard</h1>
                        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme"></button>
                    </div>
                    <p class="page-subtitle">Manage all your tracked opportunities</p>
                </div>
            </div>
    
            <div class="stats-block">
                <section class="stats-row" aria-label="Application summary">
                    <article class="stat-pill">
                        <span class="stat-label">Total</span>
                        <strong id="stat-total">0</strong>
                    </article>
                    <article class="stat-pill">
                        <span class="stat-label">Applied</span>
                        <strong id="stat-applied">0</strong>
                    </article>
                    <article class="stat-pill">
                        <span class="stat-label">Interview</span>
                        <strong id="stat-interview">0</strong>
                    </article>
                    <article class="stat-pill">
                        <span class="stat-label">Offers</span>
                        <strong id="stat-offer">0</strong>
                    </article>
                </section>
                <button id="export-btn" class="export-btn" type="button">Export to Excel</button>
            </div>
        </div>

        <main class="page-card">
          <div id="dashboard-table-shell" class="table-shell">
            <table class="jobs-table">
              <thead>
                <tr>
                  <th scope="col">Role</th>
                  <th scope="col">Company</th>
                  <th scope="col">Location</th>
                  <th scope="col">Status</th>
                  <th scope="col">Date Applied</th>
                  <th scope="col">Portal</th>
                  <th scope="col">Actions</th>
                </tr>
                <tr class="table-filter-row">
                  <th scope="col"><input id="filter-role" type="text" placeholder="Filter role" /></th>
                  <th scope="col"><input id="filter-company" type="text" placeholder="Filter company" /></th>
                  <th scope="col"><input id="filter-location" type="text" placeholder="Filter location" /></th>
                  <th scope="col">
                    <select id="filter-status">
                      <option value="all">All statuses</option>
                    </select>
                  </th>
                  <th scope="col"><input id="filter-date" type="date" /></th>
                  <th scope="col"><input id="filter-portal" type="text" placeholder="Filter portal" /></th>
                  <th scope="col"></th>
                </tr>
              </thead>
              <tbody id="dashboard-table-body"></tbody>
            </table>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="dashboard.js"></script>
  </body>
</html>
